name: ci

on:
  push:
  pull_request:

jobs:
  scrub:
    name: Scrub gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Run the scrub gate
        run: node scripts/scrub-gate.mjs

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: scrub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install ffmpeg, Pillow and a caption font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil fonts-dejavu-core
      - name: Run the tests
        run: npm test
